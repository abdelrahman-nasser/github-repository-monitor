name: Backend CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore GitHubRepositoryMonitor.sln

      - name: Build
        run: dotnet build GitHubRepositoryMonitor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GitHubRepositoryMonitor.sln --configuration Release --no-build --no-restore
